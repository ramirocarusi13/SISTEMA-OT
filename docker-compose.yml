services:
  backend:
    container_name: api-ot
    build:
      context: ./ordenes-sar
      dockerfile: dockerfile
    env_file:
      - ./ordenes-sar/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8585:80"
    restart: unless-stopped
    volumes:
      # ot_files es el volumen REAL con los adjuntos (ver deploy.bat de ordenes-sar).
      # Antes decia "sistema_ot_archivos": cada vez que se alternaba entre compose
      # y deploy.bat, las fotos nuevas quedaban en un volumen y la app montaba el
      # otro (fotos "desaparecidas" en las OT, 02/09/2026). Se fusionaron ambos
      # volumenes ese dia; desde entonces el unico valido es ot_files.
      - ot_files:/var/www/html/public/storage/archivos

  frontend:
    container_name: ot-front
    build:
      context: ./ot-front
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "9050:80"
    restart: unless-stopped

volumes:
  ot_files:
    external: true

# Misma red que usan los deploy.bat de ordenes-sar y ot-front (docker run
# --network ot-network). Sin esto, Compose crea su red propia
# (sistema-ot_default) y si un contenedor se deploya por compose y el otro por
# deploy.bat quedan en redes distintas: nginx del front no resuelve el
# upstream "backend" y reinicia en loop (paso el 01/09 y el 07/09/2026).
networks:
  default:
    name: ot-network
    external: true
